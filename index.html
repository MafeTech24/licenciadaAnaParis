                "text": "Se abordan problemáticas vinculares, dependencia emocional, trastornos de ansiedad, duelos, transiciones vitales como la menopausia y gestión de emociones. Es un espacio terapéutico confidencial de adultos orientado a desarmar patrones disfuncionales, fortalecer la autoestima y desarrollar recursos de afrontamiento saludables."

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Es un sostén emocional, físico e informativo integral durante el embarazo, el parto y el puerperio. Como Doula y psicóloga, acompaño a la persona gestante y su entorno a transitar la maternidad con tranquilidad, despejando temores, fortaleciendo la confianza en el propio cuerpo y brindando apoyo en lactancia y crianza temprana."
              }
            },

              "@type": "Question",
              "name": "¿En qué etapas se puede empezar el acompañamiento perinatal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Podés iniciar el acompañamiento en cualquier momento de la gestación, durante la preparación para el parto o en el posparto inmediato. También es un espacio propicio para abordar el deseo de concebir, la búsqueda de embarazo o el procesamiento emocional de experiencias previas de parto y puerperio."

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Estás en una dinámica de codependencia si priorizás constantemente las necesidades del otro sobre las tuyas, sentís miedo extremo al abandono o justificás conductas dañinas. Otros signos frecuentes son la pérdida de identidad propia, la necesidad de controlar o rescatar a la pareja y la dificultad persistente para poner límites."
              }
            },

              }
